[package]
name = "immich-ios-ffi"
version = "0.1.0"
edition = "2021"
description = "C FFI boundary for Immich iOS Native Client using immich-core"
license = "MIT"

[lib]
name = "immich_ios_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
immich-core = { path = "../immich-core" }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
