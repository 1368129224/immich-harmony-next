name: Build iOS (IPA)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-unsigned:
    name: IPA (UNSIGNED - not installable on stock devices)
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Verify native-only source tree
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_native_ios.py

      - name: Build Rust core static library
        run: |
          bash scripts/build_ios_lib.sh release

      - name: Build native iOS app without signing
        run: |
          COMMIT_HASH="$(git rev-parse --short HEAD)"
          xcodebuild \
            -project ios-app/Runner.xcodeproj \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            "MARKETING_VERSION=0.0.2+$COMMIT_HASH" \
            "IMMICH_GIT_COMMIT=$COMMIT_HASH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify native-only app bundle
        run: |
          PRODUCTS="build/ios/DerivedData/Build/Products"
          python3 scripts/check_native_ios.py \
            --app "$PRODUCTS/Release-iphoneos/Runner.app"

      - name: Package .app into an .ipa
        run: |
          APP="build/ios/DerivedData/Build/Products/Release-iphoneos/Runner.app"
          test -d "$APP" || { echo "::error::$APP not found"; exit 1; }
          COMMIT_HASH="$(git rev-parse --short HEAD)"
          PLIST="$APP/Info.plist"
          VERSION="0.0.2+$COMMIT_HASH"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $VERSION" \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleShortVersionString string $VERSION" \
            "$PLIST"
          mkdir -p build/ios/package/Payload
          cp -R "$APP" build/ios/package/Payload/
          (cd build/ios/package && \
            /usr/bin/zip --symlinks -qry ../../../Immich-unsigned.ipa Payload)
          ls -lh Immich-unsigned.ipa

      - name: Generate update manifest
        if: github.ref == 'refs/heads/main'
        run: |
          APP_PLIST="build/ios/DerivedData/Build/Products/Release-iphoneos/Runner.app/Info.plist"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleVersion' "$APP_PLIST")"
          COMMIT_HASH="$(git rev-parse --short HEAD)"
          IPA_SHA256="$(shasum -a 256 Immich-unsigned.ipa | \
            awk '{print $1}')"
          export BUILD_NUMBER COMMIT_HASH IPA_SHA256
          python3 - <<'PY'
          import json, os
          with open('immich-update.json', 'w') as f:
              json.dump({
                  'bundleIdentifier': 'com.immichz.immichz',
                  'channel': 'main',
                  'buildNumber': int(os.environ['BUILD_NUMBER']),
                  'version': '0.0.2+' + os.environ['COMMIT_HASH'],
                  'commit': os.environ['COMMIT_HASH'],
                  'sha256': os.environ['IPA_SHA256'],
                  'downloadURL': (
                      'https://github.com/1368129224/immich-h/releases/'
                      'download/latest-build/Immich-unsigned.ipa'
                  ),
              }, f, indent=2)
          PY

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: immich-ios-ipa-unsigned
          path: Immich-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish unsigned IPA and update manifest to latest-build release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest-build"
          gh release view "$TAG" >/dev/null 2>&1 || {
            gh release create "$TAG" --title "Latest Build (Continuous)" \
              --notes "Continuously updated build artifacts."
          }
          gh release upload "$TAG" Immich-unsigned.ipa \
            immich-update.json --clobber

      - name: Upload raw .app bundle
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: immich-ios-app-bundle
          path: build/ios/DerivedData/Build/Products/*/Runner.app
          if-no-files-found: warn
          retention-days: 30

  build-ios-signed:
    name: IPA (signed)
    runs-on: macos-15
    if: ${{ vars.ENABLE_IOS_SIGNING == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Build Rust core static library
        run: |
          bash scripts/build_ios_lib.sh release

      - name: Import signing certificate into a temporary keychain
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$APPLE_CERTIFICATE_BASE64" | \
            base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-key-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KC" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KC"
          security list-keychain -d user -s "$KC"
          security find-identity -v -p codesigning

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: >-
            ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP="$RUNNER_TEMP/build_pp.mobileprovision"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i "$PP" | \
            grep -aA1 UUID | grep -o "[-a-zA-Z0-9]\{36\}" | head -1)
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP" "$profile_dir/$UUID.mobileprovision"
          echo "PROVISIONING_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Build signed native iOS app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_TEAM_ID" || {
            echo "::error::Configure APPLE_TEAM_ID for signed builds"
            exit 1
          }
          COMMIT_HASH="$(git rev-parse --short HEAD)"
          xcodebuild \
            -project ios-app/Runner.xcodeproj \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/SignedDerivedData \
            "MARKETING_VERSION=0.0.2+$COMMIT_HASH" \
            "IMMICH_GIT_COMMIT=$COMMIT_HASH" \
            "PROVISIONING_PROFILE_SPECIFIER=$PROVISIONING_PROFILE_UUID" \
            "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            build

      - name: Verify native-only signed app bundle
        run: |
          PRODUCTS="build/ios/SignedDerivedData/Build/Products"
          python3 scripts/check_native_ios.py \
            --app "$PRODUCTS/Release-iphoneos/Runner.app"

      - name: Package signed IPA
        run: |
          APP="build/ios/SignedDerivedData/Build/Products/Release-iphoneos/Runner.app"
          test -d "$APP"
          COMMIT_HASH="$(git rev-parse --short HEAD)"
          PLIST="$APP/Info.plist"
          VERSION="0.0.2+$COMMIT_HASH"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $VERSION" \
            "$PLIST" 2>/dev/null || true
          mkdir -p build/ios/signed-package/Payload
          cp -R "$APP" build/ios/signed-package/Payload/
          (cd build/ios/signed-package && \
            /usr/bin/zip --symlinks -qry ../../../Immich-signed.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: immich-ios-ipa-signed
          path: Immich-signed.ipa
          if-no-files-found: error
